name: Build SukiSU Kernel (Xiaomi Marble)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      # BƯỚC 1: Cài đặt các thư viện cơ bản
      - name: Setup Dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache flex bison libssl-dev dpkg-dev libelf-dev xz-utils git

      # BƯỚC 2: Setup Clang Toolchain bằng GitHub mirror
      - name: Setup Clang Toolchain (r487747c)
        run: |
          echo "Cloning Clang prebuilt from GitHub mirror..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86.git clang
          echo "PATH=$PATH:${{ github.workspace }}/clang/bin" >> $GITHUB_ENV

      # BƯỚC 3: Áp dụng Patch SukiSU-Ultra (susfs-main)
      - name: Apply SukiSU-Ultra Patch
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          if [ -f scripts/config ]; then
            scripts/config --enable CONFIG_KPM
            scripts/config --enable CONFIG_KALLSYMS
            scripts/config --enable CONFIG_KALLSYMS_ALL
          fi

      # BƯỚC 4: Cấu hình build
      - name: Set up build configuration
        run: |
          export KBUILD_BUILD_USER=thedangcoder
          export KBUILD_BUILD_HOST=GitHub-Actions
          make O=out ARCH=arm64 vendor/marble_defconfig

      # BƯỚC 5: Biên dịch kernel
      - name: Build Kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOADADDR=0x40000000

      # BƯỚC 6: Đóng gói với AnyKernel3
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image
          elif [ -f "out/arch/arm64/boot/Image.lz4" ]; then
            cp out/arch/arm64/boot/Image.lz4 AnyKernel3/Image
          elif [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image
          else
            echo "Error: Kernel image not found"
            exit 1
          fi
          cd AnyKernel3
          zip -r9 SukiSU-Marble-$(date +%Y%m%d).zip *

      # BƯỚC 6.5: Tạo short SHA
      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      # BƯỚC 7: Tạo Release trên GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: SukiSU_Build_${{ env.SHORT_SHA }}
          name: SukiSU Marble Build (${{ env.SHORT_SHA }})
          body: "Automatic build of Xiaomi Marble kernel with SukiSU-Ultra (susfs-main branch)."
          files: AnyKernel3/SukiSU-Marble-*.zip
