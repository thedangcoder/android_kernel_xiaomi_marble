name: Build SukiSU Kernel (Xiaomi Marble)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Tăng thời gian chờ đợi (timeout) vì build kernel mất nhiều thời gian
    timeout-minutes: 60 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      # BƯỚC THIẾT LẬP CÔNG CỤ (FIXED)
      - name: Setup Dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache flex bison libssl-dev dpkg-dev libelf-dev xz-utils

      - name: Setup AOSP Clang Toolchain (r487747c)
        # Action này đã được sửa lỗi
        uses: kdrag0n/android-build-action@v1.0.0
        with:
          toolchain-url: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz
          toolchain-path: ${{ github.workspace }}/clang
          kernel-arch: arm64

      - name: Apply SukiSU-Ultra (susfs-main) Patch
        run: |
          # Mã nguồn kernel ở thư mục gốc, không cần 'cd' vào thư mục con.
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          
          # Đảm bảo các CONFIG cần thiết được bật
          scripts/config --enable CONFIG_KPM
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL

      - name: Set up build configuration
        run: |
          export KBUILD_BUILD_USER=thedangcoder
          export KBUILD_BUILD_HOST=GitHub-Actions
          
          # SỬA: Dùng defconfig chính xác
          make O=out ARCH=arm64 vendor/marble_defconfig

      - name: Build Kernel
        run: |
          # Lệnh build chính
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LOADADDR=0x40000000 \
            vendor/marble_defconfig

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          
          # GIẢ ĐỊNH: File output là Image.gz. Nếu lỗi, thử Image.lz4
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image
          elif [ -f "out/arch/arm64/boot/Image.lz4" ]; then
            cp out/arch/arm64/boot/Image.lz4 AnyKernel3/Image
          else
            echo "Error: Kernel image not found. Check build output."
            exit 1
          fi

          # Copy DTB/DTBO nếu có (thường cần cho thiết bị Android hiện đại)
          # Tùy chọn: Thêm các file dtb/dtbo nếu kernel Marble yêu cầu
          # cp out/arch/arm64/boot/dts/vendor/qcom/sm8450-marble.dtb AnyKernel3/dtb

          cd AnyKernel3
          zip -r9 SukiSU-Marble-$(date +%Y%m%d).zip *

      - name: Create GitHub Release
        # Tự động tạo release trên GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: SukiSU_Build_${{ github.sha }}
          name: SukiSU Marble Build (${{ github.sha }})
          body: "Automatic build of Xiaomi Marble kernel with SukiSU-Ultra (susfs-main branch)."
          files: AnyKernel3/SukiSU-Marble-*.zip
